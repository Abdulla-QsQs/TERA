services:
  - type: web
    name: tera-paper-compiler
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: TERA_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
